services:

  # ==================================================
  # SHARED INFRASTRUCTURE
  # ==================================================

  messagebroker:
    image: rabbitmq:4-management
    profiles: ["identity", "full"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    profiles: ["identity", "full"]
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - backend-network

  # ==================================================
  # IDENTITY SERVICE
  # ==================================================

  identity-db:
    image: mysql:8.4
    profiles: ["identity", "full"]
    environment:
      MYSQL_DATABASE: ${IDENTITY_DB_NAME}
      MYSQL_USER: ${IDENTITY_DB_USER}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_DB_ROOT_PASSWORD}
    restart: always
    volumes:
      - identity_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${IDENTITY_DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - backend-network

  identity-api:
    image: toeicspace/identity-api
    profiles: ["identity", "full"]
    build:
      context: .
      dockerfile: src/Services/Identity/ToeicSpace.Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      DOTNET_gcServer: "0"

      CloudflareR2__Endpoint: ${R2_ENDPOINT}
      CloudflareR2__AccessKey: ${R2_ACCESS_KEY}
      CloudflareR2__SecretKey: ${R2_SECRET_KEY}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME}

      ConnectionStrings__IdentityDatabase: >-
        Server=identity-db;
        Port=3306;
        Database=${IDENTITY_DB_NAME};
        User=${IDENTITY_DB_USER};
        Password=${IDENTITY_DB_PASSWORD};

      ConnectionStrings__Redis: redis:6379

      RabbitMQ__Host: messagebroker
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
    ports:
      - "${IDENTITY_API_PORT}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - backend-network

