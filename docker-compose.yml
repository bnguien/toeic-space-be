services:

  identitydb:
    image: mysql:8.4
    container_name: toeicspace-identitydb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME}
    restart: always
    ports:
      - "${IDENTITY_DB_PORT}:3306"
    volumes:
      - toeicspace_identitydb:/var/lib/mysql

  messagebroker:
    image: rabbitmq:4-management
    container_name: toeicspace-messagebroker
    hostname: ${RABBITMQ_HOST}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

  identity-api:
    image: toeicspace/identity-api
    container_name: toeicspace-identity-api
    build:
      context: .
      dockerfile: src/Services/Identity/ToeicSpace.Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__IdentityDatabase: >-
        Server=${IDENTITY_DB_HOST};
        Port=3306;
        Database=${IDENTITY_DB_NAME};
        User=${IDENTITY_DB_USER};
        Password=${IDENTITY_DB_PASSWORD};
    depends_on:
      - identitydb
      - messagebroker
    ports:
      - "${IDENTITY_API_PORT}:8080"

  api-gateway:
    image: toeicspace/api-gateway
    container_name: toeicspace-api-gateway
    build:
      context: .
      dockerfile: src/ApiGateways/ToeicSpace.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
    depends_on:
      - identity-api
    ports:
      - "${API_GATEWAY_PORT}:8080"

volumes:
  toeicspace_identitydb: