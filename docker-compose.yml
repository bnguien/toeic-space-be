  # ==================================================
  # API GATEWAY
  # ==================================================

  api-gateway:
    image: toeicspace/api-gateway
    profiles: ["identity", "full"]
    build:
      context: .
      dockerfile: src/ApiGateways/ToeicSpace.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      DOTNET_gcServer: "0"

      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: http://identity-api:8080/

    ports:
      - "${API_GATEWAY_PORT}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - frontend-network
      - backend-network


networks:
  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge


